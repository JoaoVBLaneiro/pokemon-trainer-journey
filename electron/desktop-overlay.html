<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Trainer Journey Desktop Overlay POC</title>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
    }

    body {
      pointer-events: none;
    }

    .pokemon {
      --x: 18vw;
      --y: 68vh;

      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 78px;
      height: 78px;
      transform-origin: 50% 100%;
      animation:
        desktop-wander 18s linear infinite alternate,
        pokemon-bounce 0.62s ease-in-out infinite alternate;
      filter: drop-shadow(0 7px 4px rgba(0, 0, 0, 0.18));
    }

    .pokemon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .pokemon-shadow {
      position: absolute;
      left: 50%;
      bottom: -2px;
      width: 42px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.14);
      filter: blur(1px);
      animation: shadow-breathe 0.62s ease-in-out infinite alternate;
    }

    .proof-label {
      position: fixed;
      left: 18px;
      bottom: 18px;
      padding: 8px 11px;
      border-radius: 10px;
      color: rgba(255,255,255,.86);
      background: rgba(15, 44, 38, .52);
      font-size: 12px;
      letter-spacing: .02em;
      opacity: .72;
    }

    @keyframes pokemon-bounce {
      from {
        margin-top: 0;
        rotate: -1.5deg;
      }

      to {
        margin-top: -7px;
        rotate: 1.5deg;
      }
    }

    @keyframes shadow-breathe {
      from {
        transform: translateX(-50%) scaleX(1);
        opacity: .18;
      }

      to {
        transform: translateX(-50%) scaleX(.78);
        opacity: .10;
      }
    }

    @keyframes desktop-wander {
      0% {
        left: 12vw;
        top: 67vh;
      }

      18% {
        left: 28vw;
        top: 73vh;
      }

      39% {
        left: 43vw;
        top: 62vh;
      }

      61% {
        left: 57vw;
        top: 70vh;
      }

      80% {
        left: 72vw;
        top: 58vh;
      }

      100% {
        left: 83vw;
        top: 69vh;
      }
    }
  </style>
</head>

<body>
  <div class="pokemon" title="Lombre">
    <span class="pokemon-shadow"></span>
    <img
      src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-vii/icons/272.png"
      alt="Lombre"
    />
  </div>

  <div class="proof-label">
    Trainer Journey desktop-overlay proof of concept
  </div>
</body>
</html>
